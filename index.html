<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:36px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.3px}
.by{font-size:11px;color:var(--dim);letter-spacing:.6px}
select{background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.ct{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:12px}
ol{margin:0;padding-left:20px}ol li+li{margin-top:8px}
.inst{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px}
esp-web-install-button button[slot=activate]{border:0;border-radius:12px;background:#e9e9e9;color:#111;font:600 16px/1 system-ui,sans-serif;padding:15px 30px;cursor:pointer}
esp-web-install-button button[slot=activate]:hover{background:#fff}
.note{font-size:13px;color:var(--muted)}
.boot{border:1px solid #e8b33988;background:#2a2312;color:#f3e6c4;border-radius:12px;padding:12px 14px;font-size:14px;text-align:left;max-width:520px}.boot b{color:var(--warn)}
.warn{color:var(--warn);font-size:14px;text-align:center}

a{color:var(--text);text-underline-offset:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv span{color:var(--muted)}
esp-web-install-button:not(:defined) [slot=unsupported],esp-web-install-button:not(:defined) [slot=not-allowed]{display:none}
footer{color:var(--dim);font-size:12px;margin-top:26px;text-align:center}
</style>

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function pick(){const s=ls.get('lg');if(L[s])return s;for(const x of(navigator.languages||[navigator.language||'en'])){const c=String(x).slice(0,2).toLowerCase();if(L[c])return c}return'en'}
function apply(lg){const d=L[lg];document.documentElement.lang=lg;document.querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=d[e.dataset.t]||L.en[e.dataset.t]||''});
  document.title='Reloj LED · '+d.install}
const sel=document.getElementById('lang');let cur=pick();
sel.innerHTML=Object.keys(L).map(k=>`<option value="${k}" ${k==cur?'selected':''}>${L[k].name}</option>`).join('');
sel.onchange=()=>{cur=sel.value;ls.set('lg',cur);apply(cur)};apply(cur);
